<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Apex Dynamics</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background-color: var(--bg-surface);">
  <div class="card" style="width: 100%; max-width: 420px;">
    <div class="text-center" style="margin-bottom: 2rem;">
      <a href="index.html" class="logo">Apex<span>Dynamics</span></a>
      <p class="text-secondary" style="font-size: 0.9rem; margin-top: 0.5rem;">Secure Admin & Client Portal</p>
    </div>
    <form action="admin-dashboard.html">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" required value="admin@apexdynamics.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" required value="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
    </form>
  </div>
</body>
</html>
