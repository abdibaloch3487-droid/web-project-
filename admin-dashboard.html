<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Apex Dynamics Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: var(--bg-surface);">
  <div style="display: flex; min-height: 100vh;">
    <aside style="width: 260px; background: var(--primary); color: #fff; padding: 2rem;">
      <h3 class="logo" style="color: #fff; margin-bottom: 3rem;">Apex<span>Admin</span></h3>
      <ul style="display: flex; flexDirection: column; gap: 1rem;">
        <li><a href="#" style="color: #fff; font-weight: 600;">Overview</a></li>
        <li><a href="#" style="color: #94A3B8;">Leads & Inquiries</a></li>
        <li><a href="#" style="color: #94A3B8;">Portfolio Manager</a></li>
        <li><a href="index.html" style="color: #94A3B8; margin-top: 4rem; display: block;">Logout</a></li>
      </ul>
    </aside>
    <main style="flex: 1; padding: 3rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
        <h2>Dashboard Overview</h2>
        <span class="badge">Logged in as Administrator</span>
      </div>
      <div class="grid-3" style="margin-bottom: 3rem;">
        <div class="card">
          <h4>Total Inquiries</h4>
          <p style="font-size: 2rem; font-weight: 700; color: var(--secondary);">42</p>
        </div>
        <div class="card">
          <h4>Active Projects</h4>
          <p style="font-size: 2rem; font-weight: 700; color: var(--accent);">12</p>
        </div>
        <div class="card">
          <h4>System Status</h4>
          <p style="font-size: 2rem; font-weight: 700; color: var(--secondary);">Optimal</p>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
